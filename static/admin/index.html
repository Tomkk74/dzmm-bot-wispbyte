<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>群机控制室</title>
  <link rel="stylesheet" href="/admin/static/admin.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">群机控制室</div>
      <p class="tag">欢迎词 · 小游戏 · 跑图密钥 · 大模型 — 按群配置</p>
    </header>

    <section id="view-login" class="panel">
      <h1>登录</h1>
      <div class="tabs">
        <button type="button" class="tab on" data-tab="master">总管理</button>
        <button type="button" class="tab" data-tab="group">群管理码</button>
      </div>
      <form id="form-master" class="stack">
        <label>总管理密码 <input type="password" name="password" autocomplete="current-password" /></label>
        <button type="submit" class="btn">进入</button>
      </form>
      <form id="form-group" class="stack hidden">
        <label>群 ID（chatroom） <input name="chatroom_id" placeholder="uuid" /></label>
        <label>群管理码 <input name="code" placeholder="后台发给你的码" /></label>
        <button type="submit" class="btn">进入本群配置</button>
      </form>
      <p id="login-err" class="err"></p>
      <p class="hint">群首次出现消息后会自动登记。总管理可在列表里查看/重置「群管理码」交给群主。</p>
    </section>

    <section id="view-main" class="hidden">
      <div class="toolbar">
        <span id="who"></span>
        <button type="button" class="btn ghost" id="btn-logout">退出</button>
      </div>
      <div class="layout">
        <aside class="panel list">
          <h2>群列表</h2>
          <ul id="group-list"></ul>
          <p class="hint">点选后右侧编辑。无群时先在目标群发一条「帮助」。</p>
        </aside>
        <main class="panel editor">
          <h2 id="edit-title">配置</h2>
          <form id="form-settings" class="stack hidden">
            <label>显示名称 <input name="title" /></label>
            <label>欢迎词 /「你好」回复
              <textarea name="welcome_text" rows="8"></textarea>
            </label>
            <label>帮助文案
              <textarea name="help_text" rows="8"></textarea>
            </label>

            <fieldset>
              <legend>小游戏</legend>
              <label class="row"><input type="checkbox" name="game_dice" /> 骰子</label>
              <label class="row"><input type="checkbox" name="game_lot" /> 抽签</label>
            </fieldset>

            <fieldset>
              <legend>跑图 / 生图（MoeNode）</legend>
              <label class="row"><input type="checkbox" name="draw_enabled" /> 允许 /画</label>
              <label>跑图密钥（MoeNode API Key）
                <input type="password" name="moenode_api_key" placeholder="已配置则留空表示不改" autocomplete="off" />
              </label>
              <label class="row"><input type="checkbox" name="clear_moe" /> 清空跑图密钥</label>
              <p class="hint" id="moe-hint"></p>
            </fieldset>

            <fieldset>
              <legend>大模型（OpenAI 兼容）</legend>
              <label class="row"><input type="checkbox" name="llm_enabled" /> 开启对话</label>
              <label>接口 Base URL <input name="llm_base_url" placeholder="https://api.openai.com/v1" /></label>
              <label>模型名 <input name="llm_model" placeholder="gpt-4o-mini" /></label>
              <label>API Key
                <input type="password" name="llm_api_key" placeholder="已配置则留空表示不改" autocomplete="off" />
              </label>
              <label class="row"><input type="checkbox" name="clear_llm" /> 清空大模型密钥</label>
              <label>唤醒词（逗号分隔） <input name="llm_wake" placeholder="小哈,助手" /></label>
              <label>系统提示词 <textarea name="llm_system" rows="4"></textarea></label>
              <p class="hint" id="llm-hint"></p>
            </fieldset>

            <fieldset id="code-box">
              <legend>群管理码</legend>
              <p>把下面的码发给群主，对方用「群管理码」登录只能改本群。</p>
              <code id="group-code">—</code>
              <button type="button" class="btn ghost" id="btn-rotate">重置管理码</button>
            </fieldset>

            <button type="submit" class="btn">保存</button>
            <p id="save-msg" class="ok"></p>
          </form>
          <p id="edit-empty" class="hint">← 先选一个群</p>
        </main>
      </div>
    </section>
  </div>
  <script src="/admin/static/admin.js"></script>
</body>
</html>
